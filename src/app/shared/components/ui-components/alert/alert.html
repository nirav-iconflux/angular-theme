<div role="alert" [class]="hostClass()">
  <div class="flex items-start gap-3"
       [class.justify-between]="isAction()">
    <!-- Left: icon + stacked content -->
    <div class="flex items-start gap-3 min-w-0 flex-1">
      <span class="mt-0.5 shrink-0 [&>svg]:size-4">
        <ng-content select="[alert-icon]"></ng-content>
      </span>
      <div class="min-w-0">
        <div class="font-semibold leading-snug tracking-tight">
          <ng-content select="[alert-title]"></ng-content>
        </div>
        <div class="mt-1 text-muted-foreground"
             [class.text-destructive]="variant() === 'destructive'">
          <ng-content select="[alert-description]"></ng-content>
        </div>
      </div>
    </div>
    <!-- Right: action (only visible when variant=action) -->
    <div class="shrink-0">
      <ng-content select="[alert-action]"></ng-content>
    </div>
  </div>
</div>
