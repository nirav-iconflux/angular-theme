<ng-template cdkPortal>
    <div class="inset-0 z-50 flex" [class.fixed]="positionMode === 'fixed'"
        [class.absolute]="positionMode === 'absolute'" [class.items-center]="layoutType === 1"
        [class.justify-center]="layoutType === 1" [class.justify-end]="layoutType === 2" [class.px-4]="layoutType === 1"
        [class.ps-8]="layoutType === 2">
        <div class="absolute inset-0 bg-black/50 transition-opacity duration-300 ease-in-out"
            [class.opacity-100]="isVisible" [class.opacity-0]="!isVisible" aria-hidden="true"></div>

        <div #dialogContainer class="relative bg-white dark:bg-zinc-950 shadow-2xl flex flex-col overflow-hidden z-10"
            [ngClass]="widthClass" [class.rounded-xl]="layoutType === 1" [class.max-h-[90vh]]="layoutType === 1"
            [class.h-full]="layoutType === 2" [class.rounded-l-2xl]="layoutType === 2" [class.transform]="true"
            [class.transition-all]="layoutType === 1" [class.transition-transform]="layoutType === 2"
            [class.duration-500]="true" [class.ease-in-out]="true" [class.scale-100]="layoutType === 1 && isVisible"
            [class.opacity-100]="layoutType === 1 && isVisible" [class.scale-95]="layoutType === 1 && !isVisible"
            [class.opacity-0]="layoutType === 1 && !isVisible" [class.translate-x-0]="layoutType === 2 && isVisible"
            [class.translate-x-full]="layoutType === 2 && !isVisible" (transitionend)="onTransitionEnd($event)">
            <div
                class="px-6 py-3 border-b border-zinc-100 dark:border-zinc-800 flex items-center justify-between bg-white dark:bg-zinc-950">
                <ng-content select="[dialog-header]"></ng-content>
            </div>

            <div class="flex-1 overflow-y-auto">
                <ng-content select="[dialog-content]"></ng-content>
            </div>

            @if(footerVisible) {

            <div
                class="px-6 py-5 border-t border-zinc-100 dark:border-zinc-800 bg-zinc-50/50 dark:bg-zinc-900/50 flex items-center gap-3">
                <ng-content select="[dialog-footer]"></ng-content>
            </div>
            }
        </div>
    </div>
</ng-template>
