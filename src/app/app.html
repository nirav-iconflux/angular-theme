<div class="flex h-screen w-full overflow-hidden bg-[var(--background)] text-[var(--foreground)] font-sans">
  
  <!-- Sidebar -->
  <aside 
    class="flex shrink-0 z-30 border-r border-[var(--border)] bg-[var(--sidebar)] transition-all duration-300 ease-in-out overflow-hidden" 
    [style.width]="isExpanded() ? 'var(--app-sidebar-width-expanded)' : 'var(--app-sidebar-width-collapsed)'"
  >
    <!-- 2. Secondary Panel (Collapsible content) -->
    <div class="flex flex-col flex-1 min-w-0 h-full bg-[var(--sidebar)] py-6 px-4 gap-6 opacity-100 transition-opacity duration-300"
         [class.opacity-0]="!isExpanded()"
         [class.pointer-events-none]="!isExpanded()">
       
       <!-- Header -->
       <div class="flex items-center justify-between pb-6 ps-5">
          <h2 class="font-semibold text-sm text-[var(--muted-foreground)] uppercase tracking-wider">Campaigns</h2>
          <button (click)="toggleSidebar()" class="h-6 w-6 flex items-center justify-center rounded-md hover:bg-[var(--sidebar-accent)] text-[var(--muted-foreground)] transition-colors">
             <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 12l12 6"/></svg>
          </button>
       </div>

       <!-- Section 1 -->
       <div class="space-y-1">
          <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md bg-[var(--accent)] text-[var(--accent-foreground)] font-medium text-sm transition-colors">
             <span class="shrink-0 text-[var(--primary)] [&>svg]:w-5 [&>svg]:h-5" [innerHTML]="svg.chart"></span>
             Overview
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[var(--sidebar-accent)] text-[var(--sidebar-foreground)] font-medium text-sm transition-colors group">
             <span class="shrink-0 text-[var(--muted-foreground)] group-hover:text-[var(--foreground)] [&>svg]:w-5 [&>svg]:h-5" [innerHTML]="svg.rocket"></span>
             Recommendations
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[var(--sidebar-accent)] text-[var(--sidebar-foreground)] font-medium text-sm transition-colors group justify-between">
             <div class="flex items-center gap-3">
                 <span class="shrink-0 text-[var(--muted-foreground)] group-hover:text-[var(--foreground)] [&>svg]:w-5 [&>svg]:h-5" [innerHTML]="svg.sparkles"></span>
                 Insights
             </div>
             <span class="bg-[var(--primary)]/10 text-[var(--primary)] text-xs font-semibold px-2 py-0.5 rounded-full">10</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[var(--sidebar-accent)] text-[var(--sidebar-foreground)] font-medium text-sm transition-colors group">
             <span class="shrink-0 text-[var(--muted-foreground)] group-hover:text-[var(--foreground)] [&>svg]:w-5 [&>svg]:h-5" [innerHTML]="svg.megaphone"></span>
             Campaigns
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[var(--sidebar-accent)] text-[var(--sidebar-foreground)] font-medium text-sm transition-colors group">
             <span class="shrink-0 text-[var(--muted-foreground)] group-hover:text-[var(--foreground)] [&>svg]:w-5 [&>svg]:h-5" [innerHTML]="svg.search"></span>
             Keywords
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[var(--sidebar-accent)] text-[var(--sidebar-foreground)] font-medium text-sm transition-colors group">
             <span class="shrink-0 text-[var(--muted-foreground)] group-hover:text-[var(--foreground)] [&>svg]:w-5 [&>svg]:h-5" [innerHTML]="svg.pie"></span>
             Reporting
          </a>
       </div>       
       
       <!-- Bottom Card -->
       <div class="mt-auto border border-[var(--sidebar-border)] rounded-xl p-3 bg-[var(--card)] shadow-xs flex items-center justify-between cursor-pointer hover:border-[var(--primary)] transition-colors group">
           <div class="flex items-center gap-3">
               <div class="h-8 w-8 rounded-full bg-blue-100 dark:bg-blue-900 border border-blue-200 dark:border-blue-800 flex items-center justify-center text-blue-600 dark:text-blue-200 font-bold text-xs">
                   C
               </div>
               <div class="flex flex-col">
                   <span class="text-sm font-semibold text-[var(--foreground)]">Team Catalog</span>
                   <span class="text-[10px] text-[var(--muted-foreground)]">Analytics ID 63066612</span>
               </div>
           </div>
           <svg class="text-[var(--muted-foreground)] group-hover:text-[var(--foreground)] transition-colors" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
       </div>

    </div>
  </aside>

  <!-- Main Wrapper -->
  <div class="flex flex-1 flex-col min-w-0 overflow-hidden bg-[var(--app-bg-main)]">
    
    <!-- Top Navbar -->
    <header class="h-[var(--app-navbar-height)] flex items-center justify-between px-6 bg-[var(--background)] border-b border-[var(--border)] shrink-0 z-10 sticky top-0">
        
        <!-- Left: Breadcrumb / Title -->
        <div class="flex items-center gap-4">
            @if(!isExpanded()) {
                <button (click)="toggleSidebar()" class="h-9 w-9 flex items-center justify-center rounded-md border border-[var(--input)] bg-[var(--background)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] shadow-sm transition-colors">
                    <span class="[&>svg]:w-5 [&>svg]:h-5" [innerHTML]="svg.menu"></span>
                </button>
            }
            <div class="flex items-center text-sm text-[var(--muted-foreground)]">
                <span class="hover:text-[var(--foreground)] cursor-pointer transition-colors">Workplace</span>
                <span class="mx-2 text-[var(--border)]">/</span>
                <span class="font-medium text-[var(--foreground)]">Analytics Dashboard</span>
            </div>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-3">
             <div class="relative">
                 <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-[var(--muted-foreground)] [&>svg]:w-4 [&>svg]:h-4" [innerHTML]="svg.search"></span>
                 <input type="text" placeholder="Search..." class="pl-9 pr-4 py-2 h-9 text-sm rounded-md border border-[var(--input)] bg-[var(--background)] focus:outline-none focus:ring-1 focus:ring-[var(--ring)] w-64 transition-all">
             </div>
             
             <div class="h-6 w-px bg-[var(--border)] mx-1"></div>

             <app-button variant="outline" size="sm" class="gap-2">
                 <span class="[&>svg]:w-4 [&>svg]:h-4" [innerHTML]="svg.share"></span>
                 Export
             </app-button>
             <app-button size="sm">Create Report</app-button>
        </div>
    </header>

    <!-- Main Content Internal Scroll -->
    <main class="flex-1 overflow-auto p-6 scroll-smooth">
        <router-outlet />
    </main>
  </div>
</div>

<!-- Global Overlays -->
@if(isDialogOpen()) {
    <app-dialog-content (closed)="isDialogOpen.set(false)" [layoutType]="dialogLayoutType()"></app-dialog-content>
}
<div id="form-dialog-root-wrapper"></div>
